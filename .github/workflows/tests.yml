name: Tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - name: Compare rule baseline on held-out text cases
        run: python -m examples.compare_text --extractor rules --split test --summary
      - name: Validate new v0.5 benchmark on dev split (rule baseline only)
        run: python -m examples.compare_text --dataset benchmarks/text_v05.jsonl --extractor rules --split dev --summary
